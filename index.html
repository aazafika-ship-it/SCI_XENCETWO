<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENCETWO | OVERLORD_OS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS Singkat biar langsung kelihatan hasilnya */
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        .container { padding: 20px; }
        .card { background: #222; margin: 10px; padding: 15px; border-radius: 10px; border: 1px solid #444; }
        .hidden { display: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; 
                   display: flex; align-items: center; justify-content: center; z-index: 99; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay" onclick="bukaWeb()">
        <h1>KLIK UNTUK MASUK OVERLORD_OS</h1>
    </div>

    <div class="container">
        <h1>🚀 XENCETWO - OVERLORD_OS</h1>
        
        <div class="card">
            <h3>📸 Galeri Foto Sekelas</h3>
            <img src="foto_sekelas.jpg" alt="Foto Belum Ada" style="width:100%; border-radius:10px;">
        </div>

        <div class="card">
            <h3>📚 Jadwal Pelajaran</h3>
            <p>Senin: MTK, B.Indo, Fisika</p>
            <p>Selasa: Olahraga, Agama, Sejarah</p>
            </div>

        <div class="card">
            <h3>🧹 Daftar Piket</h3>
            <ul>
                <li>Senin: Budi, Siti, Agus</li>
                <li>Selasa: Rendi, Maya, Eko</li>
            </ul>
        </div>
    </div>

    <audio id="laguKu" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <script>
        function bukaWeb() {
            // Hilangkan overlay
            document.getElementById('overlay').style.display = 'none';
            // Putar lagu
            var audio = document.getElementById('laguKu');
            audio.play();
        }
    </script>
</body>
</html>
