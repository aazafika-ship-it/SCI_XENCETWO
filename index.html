<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCI_XENCETWO | ZANZOS V1.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b141a;
            --primary: #00d2ff;
            --secondary: #00ff88;
            --alert: #ff4444;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f1f1f1;
            --nav-bg: rgba(11, 20, 26, 0.95);
            --neon: 0 0 15px rgba(0, 210, 255, 0.6);
            --border: rgba(0, 210, 255, 0.2);
        }

        /* --- FIX LIGHT MODE --- */
        body.light-mode {
            --bg: #f5f6f7;
            --text: #1a1a1a;
            --card-bg: #ffffff;
            --border: rgba(0, 210, 255, 0.3);
            --nav-bg: rgba(255, 255, 255, 0.9);
            --neon: 0 0 5px rgba(0, 210, 255, 0.3);
        }
        
        body.light-mode .card, body.light-mode .list, body.light-mode .next-box {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* --- LOADER --- */
        #loader { position: fixed; inset: 0; background: #0b141a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-ring { width: 80px; height: 80px; border: 5px solid rgba(0, 210, 255, 0.1); border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #app { display: none; padding: 15px; padding-bottom: 120px; opacity: 0; }
        .enter-active { animation: slideUp 0.6s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        header h1 { font-family: 'Orbitron'; font-size: 22px; color: var(--primary); text-shadow: var(--neon); text-align: center; margin: 20px 0; letter-spacing: 2px; }

        /* --- CONTROL BUTTONS --- */
        .floating-ctrl { position: fixed; top: 20px; right: 15px; z-index: 1001; display: flex; gap: 8px; }
        .btn-round { width: 38px; height: 38px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--neon); font-size: 16px; }

        .hero-box { width: 100%; border-radius: 20px; overflow: hidden; border: 2px solid var(--border); box-shadow: var(--neon); margin-bottom: 20px; background: #111; min-height: 180px; }
        .hero-img { width: 100%; height: auto; display: block; object-fit: cover; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px 10px; border-radius: 18px; text-align: center; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .card h3 { font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        .date-display { font-family: 'Orbitron'; font-size: 10px; color: var(--secondary); text-align: center; margin-bottom: 15px; letter-spacing: 1px; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .list { background: var(--card-bg); border-radius: 15px; padding: 10px; margin-top: 10px; border: 1px solid var(--border); }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid var(--border); }

        .admin-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--primary); background: rgba(0,210,255,0.05); color: var(--text); margin-bottom: 10px; font-size: 11px; outline: none; }
        .save-btn { background: var(--primary); color: #000; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; border: none; font-family: 'Orbitron'; font-size: 10px; margin-top: 10px; cursor: pointer; }

        .nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 85%; background: var(--nav-bg); backdrop-filter: blur(15px); padding: 12px; border-radius: 30px; display: flex; justify-content: space-around; border: 1px solid var(--primary); z-index: 1000; }
        .nav-btn { font-size: 20px; color: gray; }
        .nav-btn.active { color: var(--primary); }

        footer { text-align: center; padding: 30px 0; opacity: 0.5; font-family: 'Orbitron'; font-size: 7px; color: var(--primary); }
    </style>
</head>
<body onload="initApp()">

    <div id="loader">
        <div class="loader-ring"></div>
        <p style="font-family:'Orbitron'; color:var(--primary); margin-top:20px; font-size:10px; letter-spacing:3px;">IX IPA A2_BOOTING...</p>
    </div>

    <div class="floating-ctrl">
        <div class="btn-round" onclick="toggleTheme()" id="theme-icon">🌓</div>
        <div class="btn-round" onclick="toggleAudio()" id="audio-icon">🔇</div>
    </div>

    <div id="admin-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; display:none; align-items:center; justify-content:center; padding:20px;">
        <div style="background:var(--bg); width:100%; max-width:280px; padding:25px; border-radius:20px; border:1px solid var(--primary); text-align:center;">
            <p style="font-family:'Orbitron'; font-size:10px; color:var(--primary); margin-bottom:15px;">SECURE_LOGIN</p>
            <input type="password" id="admin-pass" class="admin-input" placeholder="PASS_CODE" style="text-align:center;">
            <button onclick="verifyAdmin()" class="save-btn">ACCESS_SYSTEM</button>
            <button onclick="closeModal()" style="background:transparent; color:gray; border:none; margin-top:10px; font-size:9px;">CANCEL</button>
        </div>
    </div>

    <audio id="audioPlayer" loop><source src="lagu_web/menteri.mp3" type="audio/mpeg"></audio>

    <div id="app">
        <div id="home" class="page active">
            <header><h1>SCI_XENCETWO</h1></header>
            <div id="current-date" class="date-display"></div>
            
            <div class="hero-box">
                <img src="./img/sekelas.jpg" class="hero-img" alt="CLASS_TEAM" onerror="this.src='https://via.placeholder.com/600x300/0b141a/00d2ff?text=FOTO_TIDAK_ADA'">
            </div>

            <div class="grid">
                <div class="card" onclick="move('absen')"><span>📝</span><h3>Absensi</h3></div>
                <div class="card" onclick="move('siswa')"><span>🎓</span><h3>Siswa</h3></div>
                <div class="card" onclick="move('jadwal')"><span>📚</span><h3>Mapel</h3></div>
                <div class="card" onclick="move('piket')"><span>🧹</span><h3>Piket</h3></div>
                <div class="card" onclick="move('galeri')"><span>🖼️</span><h3>Galeri</h3></div>
                <div class="card" onclick="openAdminModal()"><span>⚙️</span><h3>Admin</h3></div>
            </div>
        </div>

        <div id="absen" class="page">
            <div style="background:var(--primary); color:#000; padding:5px 10px; border-radius:5px; font-size:10px; display:inline-block; margin-bottom:10px;" onclick="move('home')">← BACK</div>
            <div id="isi-absen"></div>
        </div>

        <div id="siswa" class="page">
            <div style="background:var(--primary); color:#000; padding:5px 10px; border-radius:5px; font-size:10px; display:inline-block; margin-bottom:10px;" onclick="move('home')">← BACK</div>
            <input type="text" id="searchSiswa" onkeyup="filterSiswa()" placeholder="SEARCH_SISWA..." class="admin-input">
            <div class="list" id="isi-siswa"></div>
        </div>

        <div id="admin-page" class="page">
            <div style="background:var(--primary); color:#000; padding:5px 10px; border-radius:5px; font-size:10px; display:inline-block; margin-bottom:10px;" onclick="move('home')">← EXIT</div>
            <div class="list">
                <p style="font-size:9px; font-family:'Orbitron';">ATTENDANCE_MANAGER:</p>
                <div id="admin-isi-absen"></div>
            </div>
        </div>

        <footer><p>© 2026 SCI_XENCETWO | A. ZAINAL BAGUS M.</p></footer>
    </div>

    <div class="nav">
        <div class="nav-btn" onclick="move('home')">🏠</div>
        <div class="nav-btn" onclick="move('absen')">📝</div>
        <div class="nav-btn" onclick="move('siswa')">🎓</div>
        <div class="nav-btn" onclick="openAdminModal()">⚙️</div>
    </div>

    <script>
        const murid = ["ADITYA PUTRA KUSUMA", "AHMAD ZAINAL BAGUS M.", "ALYA SAFFANAH ZAHRA", "ANDINA PUTRI CAHYANI", "AURA TAHTA ALFINA", "AYYESA FANNY ZAHRA Z.", "DIAN FATIKHASARI", "DINDA AYU MONICA", "DIVA ANGGRAINI MAGHFIROH", "ELVIA ADINSA JULYSTA", "ESA ROSITA", "FADHKAMIL HARITS ALGHANY H.", "FALENTINA JIHAN TRISNAWATI", "ISTIK FEBRIANA", "M. RAFI ZAIDAAN M.", "MOCH. SAMSUL WAHYUDI", "MUFIDATUL ISNA", "MUHAMMAD RIFKI", "MUKHAMAD SANDY ABDUL HADI", "MUSTIKATUN NISA", "NADIA ZULFA ANDIN NUR AINI", "NADIN RAMADANI ISMAIL", "NAZZILATUR RAHMANIA", "OLIVIA FITRI AL ZAHRA", "RADITYA YOGA PRIMATAMA", "SALSABILA PUTRI", "SELVIA MIRDA ALESIA", "SHAKIYA AURA PRADITHA", "SINDY AMEYLIA PUTRI", "TRI BAYU MAULANA", "VALLENTINO ZULNANDA P.", "WAHYU JATMIKO", "WISNU BAGUS SAJIWO", "PUTRI DWI ARISTA", "MUHAMMAD ZABRIAN A."];
        
        let isAdmin = false;
        let dataAbsen = JSON.parse(localStorage.getItem('db_xencetwo_2026')) || {};

        function initApp() {
            // Load theme
            if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('app').classList.add('enter-active');
                displayCurrentDate();
            }, 2000);
        }

        function displayCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options).toUpperCase();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function toggleAudio() {
            const audio = document.getElementById("audioPlayer");
            const icon = document.getElementById("audio-icon");
            if (audio.paused) { audio.play(); icon.innerText = "🔊"; } 
            else { audio.pause(); icon.innerText = "🔇"; }
        }

        function move(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'siswa') renderSiswa();
            if(id === 'absen') renderAbsen();
            if(id === 'admin-page') renderAdminAbsen();
            window.scrollTo(0,0);
        }

        function renderAbsen() {
            let h = `<div class="list">`;
            murid.forEach((n, i) => {
                let no = (i+1).toString().padStart(2, '0');
                let stat = dataAbsen[no] || "HADIR";
                let color = stat === "HADIR" ? "var(--secondary)" : "var(--alert)";
                h += `<div class="item"><span>${n}</span><span style="font-family:'Orbitron'; font-size:9px; color:${color}; font-weight:bold;">${stat}</span></div>`;
            });
            document.getElementById('isi-absen').innerHTML = h + `</div>`;
        }

        function renderAdminAbsen() {
            let h = "";
            murid.forEach((n, i) => {
                let no = (i+1).toString().padStart(2, '0');
                let stat = dataAbsen[no] || "HADIR";
                h += `<div class="item"><span>${n}</span>
                      <select onchange="updateStat('${no}', this.value)" style="background:var(--primary); color:#000; border:none; font-size:9px; border-radius:4px;">
                        <option ${stat==='HADIR'?'selected':''}>HADIR</option><option ${stat==='IZIN'?'selected':''}>IZIN</option><option ${stat==='SAKIT'?'selected':''}>SAKIT</option><option ${stat==='ALPA'?'selected':''}>ALPA</option>
                      </select></div>`;
            });
            document.getElementById('admin-isi-absen').innerHTML = h;
        }

        function updateStat(no, val) { dataAbsen[no] = val; localStorage.setItem('db_xencetwo_2026', JSON.stringify(dataAbsen)); }

        function renderSiswa() {
            let h = "";
            murid.forEach((n, i) => {
                h += `<div class="item"><span>${n}</span><span style="color:var(--primary); font-size:9px;">${i+1}</span></div>`;
            });
            document.getElementById('isi-siswa').innerHTML = h;
        }

        function filterSiswa() {
            let val = document.getElementById('searchSiswa').value.toUpperCase();
            let items = document.getElementById('isi-siswa').getElementsByClassName('item');
            for(let i=0; i<items.length; i++) {
                items[i].style.display = items[i].innerText.toUpperCase().includes(val) ? "" : "none";
            }
        }

        function openAdminModal() { if(isAdmin) move('admin-page'); else document.getElementById('admin-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('admin-modal').style.display = 'none'; }
        function verifyAdmin() { if(document.getElementById('admin-pass').value === "Tika¹") { isAdmin = true; closeModal(); move('admin-page'); } else alert("WRONG_PASS"); }
    </script>
</body>
</html>
