<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCI_XENCETWO | ZANZOS V1.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b141a;
            --primary: #00d2ff;
            --secondary: #00ff88;
            --alert: #ff4444;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f1f1f1;
            --nav-bg: rgba(11, 20, 26, 0.95);
            --neon: 0 0 15px rgba(0, 210, 255, 0.6);
            --border: rgba(0, 210, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* LOADER FIX (Pake Opacity biar gak nge-stuck) */
        #loader { position: fixed; inset: 0; background: #0b141a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 1; transition: 0.5s; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(0, 210, 255, 0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; box-shadow: var(--neon); }
        @keyframes spin { to { transform: rotate(360deg); } }

        #app { display: none; padding: 15px; padding-bottom: 150px; }
        .enter-active { display: block !important; animation: slideUp 0.6s ease forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        header h1 { font-family: 'Orbitron'; font-size: 24px; color: var(--primary); text-shadow: var(--neon); text-align: center; margin: 25px 0; letter-spacing: 2px; }

        /* HERO BOX */
        .hero-box { width: 100%; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--neon); margin-bottom: 25px; background: #000; min-height: 180px; }
        .hero-img { width: 100%; height: auto; display: block; object-fit: cover; }

        /* GRID SYSTEM */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card-bg); padding: 25px 10px; border-radius: 18px; text-align: center; border: 1px solid var(--border); backdrop-filter: blur(10px); cursor: pointer; }
        .card:active { transform: scale(0.95); background: rgba(0, 210, 255, 0.1); }
        .card span { font-size: 30px; display: block; margin-bottom: 8px; }
        .card h3 { font-size: 11px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        /* INFO CHALKBOARD V2 */
        .info-container { margin-top: 20px; margin-bottom: 20px; }
        .info-label { font-family: 'Orbitron'; font-size: 9px; color: var(--alert); letter-spacing: 2px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .info-label::before { content: ""; width: 8px; height: 8px; background: var(--alert); border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .chalkboard-v2 { background: linear-gradient(180deg, rgba(255, 68, 68, 0.1) 0%, rgba(0, 0, 0, 0.6) 100%); border: 1px solid var(--alert); border-radius: 12px; padding: 15px; overflow: hidden; }
        .chalkboard-v2 marquee { font-family: 'Orbitron'; font-size: 12px; color: #ff4444; font-weight: bold; text-shadow: 0 0 5px rgba(255,68,68,0.5); }

        /* PAGES & LISTS */
        .page { display: none; }
        .page.active { display: block; }
        .list { background: var(--card-bg); border-radius: 20px; padding: 15px; margin-top: 15px; border: 1px solid var(--border); }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid var(--border); }

        /* ADMIN UI */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .admin-input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--primary); background: rgba(0,210,255,0.05); color: white; margin-bottom: 15px; outline: none; }
        .save-btn { background: var(--primary); color: #000; width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; border: none; font-family: 'Orbitron'; cursor: pointer; }

        /* NAVIGATION */
        .nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 85%; background: var(--nav-bg); backdrop-filter: blur(20px); padding: 15px; border-radius: 40px; display: flex; justify-content: space-around; border: 1.5px solid var(--primary); z-index: 1000; box-shadow: var(--neon); }
        .nav-btn { font-size: 22px; color: #444; cursor: pointer; }
        .nav-btn.active { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary)); }

        .back-btn { background: var(--primary); color: #000; padding: 10px 20px; border-radius: 12px; font-size: 10px; font-weight: 900; margin-bottom: 20px; display: inline-block; font-family: 'Orbitron'; cursor: pointer; }
        footer { text-align: center; padding: 40px 0; opacity: 0.6; font-family: 'Orbitron'; font-size: 8px; color: var(--primary); }
    </style>
</head>
<body onload="startSystem()" onclick="playAudio()">

    <div id="loader">
        <div class="loader-ring"></div>
        <p style="font-family:'Orbitron'; color:var(--primary); margin-top:20px; font-size:10px; letter-spacing:3px;">ZANZOS_INITIALIZING...</p>
    </div>

    <div id="admin-modal" class="modal">
        <div style="background:#0b141a; width:100%; max-width:300px; padding:30px; border-radius:25px; border:2px solid var(--primary); text-align:center;">
            <p style="font-family:'Orbitron'; color:var(--primary); margin-bottom:20px;">SECURITY_CHECK</p>
            <input type="password" id="admin-pass" class="admin-input" placeholder="PASSCODE">
            <button onclick="verifyAdmin()" class="save-btn">LOGIN</button>
            <button onclick="closeModal()" style="background:transparent; color:gray; border:none; margin-top:15px; font-size:10px;">CANCEL</button>
        </div>
    </div>

    <audio id="audioPlayer" loop><source src="lagu_web/menteri.mp3" type="audio/mpeg"></audio>

    <div id="app">
        <div id="home" class="page active">
            <header><h1>SCI_XENCETWO</h1></header>
            <div class="hero-box">
                <img src="./img/sekelas.jpg" class="hero-img" alt="TEAM_IMG" onerror="this.src='https://via.placeholder.com/600x400/0b141a/00d2ff?text=X_ENCETWO_TEAM'">
            </div>
            <div class="grid">
                <div class="card" onclick="move('absen')"><span>📝</span><h3>Absensi</h3></div>
                <div class="card" onclick="move('siswa')"><span>🎓</span><h3>Siswa</h3></div>
                <div class="card" onclick="move('jadwal')"><span>📚</span><h3>Mapel</h3></div>
                <div class="card" onclick="move('piket')"><span>🧹</span><h3>Piket</h3></div>
                <div class="card" onclick="move('galeri')"><span>🖼️</span><h3>Galeri</h3></div>
                <div class="card" onclick="openAdminModal()"><span>⚙️</span><h3>Admin</h3></div>
            </div>
            <div class="info-container">
                <div class="info-label">BROADCAST_SIGNAL</div>
                <div class="chalkboard-v2"><marquee id="marquee-info">>> SYSTEM ONLINE: DATA SECURED <<</marquee></div>
            </div>
        </div>

        <div id="siswa" class="page">
            <div class="back-btn" onclick="move('home')">← BACK</div>
            <div class="list" id="isi-siswa"></div>
        </div>

        <div id="absen" class="page">
            <div class="back-btn" onclick="move('home')">← BACK</div>
            <div id="isi-absen"></div>
        </div>

        <div id="jadwal" class="page">
            <div class="back-btn" onclick="move('home')">← BACK</div>
            <div id="isi-mapel"></div>
        </div>

        <div id="piket" class="page">
            <div class="back-btn" onclick="move('home')">← BACK</div>
            <div id="isi-piket"></div>
        </div>

        <div id="admin-page" class="page">
            <div class="back-btn" onclick="move('home')">← EXIT_ADMIN</div>
            <div class="list">
                <p style="font-family:'Orbitron'; font-size:10px; margin-bottom:10px;">CHALKBOARD_MSG:</p>
                <textarea id="input-info" class="admin-input" rows="3"></textarea>
                <button class="save-btn" onclick="saveInfo()">UPDATE_INFO</button>
            </div>
        </div>

        <footer><p>© 2026 SCI_XENCETWO<br>DEV: A. ZAINAL BAGUS M.</p></footer>
    </div>

    <div class="nav">
        <div class="nav-btn active" id="btn-home" onclick="move('home')">🏠</div>
        <div class="nav-btn" onclick="move('absen')">📝</div>
        <div class="nav-btn" onclick="move('siswa')">🎓</div>
        <div class="nav-btn" onclick="openAdminModal()">⚙️</div>
    </div>

    <script>
        const murid = ["ADITYA PUTRA KUSUMA", "AHMAD ZAINAL BAGUS M.", "ALYA SAFFANAH ZAHRA", "ANDINA PUTRI CAHYANI", "AURA TAHTA ALFINA", "AYYESA FANNY ZAHRA Z.", "DIAN FATIKHASARI", "DINDA AYU MONICA", "DIVA ANGGRAINI MAGHFIROH", "ELVIA ADINSA JULYSTA", "ESA ROSITA", "FADHKAMIL HARITS ALGHANY H.", "FALENTINA JIHAN TRISNAWATI", "ISTIK FEBRIANA", "M. RAFI ZAIDAAN M.", "MOCH. SAMSUL WAHYUDI", "MUFIDATUL ISNA", "MUHAMMAD RIFKI", "MUKHAMAD SANDY ABDUL HADI", "MUSTIKATUN NISA", "NADIA ZULFA ANDIN NUR AINI", "NADIN RAMADANI ISMAIL", "NAZZILATUR RAHMANIA", "OLIVIA FITRI AL ZAHRA", "RADITYA YOGA PRIMATAMA", "SALSABILA PUTRI", "SELVIA MIRDA ALESIA", "SHAKIYA AURA PRADITHA", "SINDY AMEYLIA PUTRI", "TRI BAYU MAULANA", "VALLENTINO ZULNANDA P.", "WAHYU JATMIKO", "WISNU BAGUS SAJIWO", "PUTRI DWI ARISTA", "MUHAMMAD ZABRIAN A."];
        
        let isAdmin = false;
        let dataAbsen = JSON.parse(localStorage.getItem('db_absen_2026')) || {};

        function startSystem() {
            // FORCE REMOVE LOADER (Anti-stuck)
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('app').classList.add('enter-active');
                }, 500);
            }, 1500);

            // Load data info
            let savedInfo = localStorage.getItem('info_msg');
            if(savedInfo) {
                document.getElementById('marquee-info').innerText = ">> INFO: " + savedInfo + " <<";
                document.getElementById('input-info').value = savedInfo;
            }
            
            renderSiswa();
            renderAbsen();
        }

        function move(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'jadwal') renderMapel();
            if(id === 'piket') renderPiket();
            window.scrollTo(0,0);
        }

        function renderSiswa() {
            let h = "";
            murid.sort().forEach((n, i) => {
                h += `<div class="item"><b>${i+1}. ${n}</b><span style="font-size:10px; color:var(--primary)">XI-IPA-2</span></div>`;
            });
            document.getElementById('isi-siswa').innerHTML = h;
        }

        function renderAbsen() {
            let h = `<div class="list">`;
            murid.forEach((n, i) => {
                let no = (i+1).toString().padStart(2, '0');
                let stat = dataAbsen[no] || "HADIR";
                h += `<div class="item"><span>${n}</span>
                      <select onchange="updateAbsen('${no}', this.value)" ${isAdmin ? '' : 'disabled'} style="background:var(--primary); border:none; border-radius:5px; font-size:10px; padding:2px;">
                        <option ${stat==='HADIR'?'selected':''}>HADIR</option>
                        <option ${stat==='IZIN'?'selected':''}>IZIN</option>
                        <option ${stat==='SAKIT'?'selected':''}>SAKIT</option>
                      </select></div>`;
            });
            document.getElementById('isi-absen').innerHTML = h + `</div>`;
        }

        function renderMapel() {
            const hari = new Date().toLocaleDateString('id-ID', {weekday: 'long'});
            const j = { 'Senin': ['POK', 'BK', 'SKI'], 'Selasa': ['BIN', 'KM', 'FK'], 'Rabu': ['AH', 'BO', 'PP'], 'Kamis': ['SB', 'PK', 'BIG'], 'Jumat': ['KM', 'MT', 'PBL'] };
            let h = `<h2 style="font-family:'Orbitron'; font-size:12px; color:var(--primary); margin-bottom:15px;">>> ${hari.toUpperCase()}_SCHEDULE</h2>`;
            (j[hari] || ['LIBUR']).forEach(m => h += `<div style="background:rgba(0,210,255,0.1); padding:15px; border-left:3px solid var(--primary); margin-bottom:10px;">${m}</div>`);
            document.getElementById('isi-mapel').innerHTML = h;
        }

        function renderPiket() {
            const hari = new Date().toLocaleDateString('id-ID', {weekday: 'long'});
            const p = { 'Senin': 'Valentino, Nadin, Dian', 'Selasa': 'Alya, Ayyesa, Sandy', 'Rabu': 'Zainal, Falen, Rifki', 'Kamis': 'Tika, Isna, Andiina', 'Jumat': 'Rafi, Bayu, Adit' };
            document.getElementById('isi-piket').innerHTML = `<div style="background:rgba(0,255,136,0.1); border-left:4px solid var(--secondary); padding:20px; border-radius:15px;"><b>UNIT_${hari.toUpperCase()}:</b><br>${p[hari] || 'BASE_CLOSED'}</div>`;
        }

        function updateAbsen(no, val) { dataAbsen[no] = val; localStorage.setItem('db_absen_2026', JSON.stringify(dataAbsen)); }
        function openAdminModal() { if(isAdmin) move('admin-page'); else document.getElementById('admin-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('admin-modal').style.display = 'none'; }
        function verifyAdmin() { if(document.getElementById('admin-pass').value === "Tika") { isAdmin = true; closeModal(); renderAbsen(); move('admin-page'); } else { alert("WRONG_CODE"); } }
        function saveInfo() { localStorage.setItem('info_msg', document.getElementById('input-info').value); startSystem(); alert("INFO_UPDATED"); }
        function playAudio() { document.getElementById("audioPlayer").play().catch(() => {}); }
    </script>
</body>
</html>
